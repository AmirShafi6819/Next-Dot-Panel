# golangci-lint configuration (v2).
#
# The CI gate runs `golangci-lint run`; failures are fixed, never muted
# (Design Spec §30.8). The default set is errcheck, govet, ineffassign,
# staticcheck, and unused — gosec is added because this project treats
# security-relevant findings as build failures.

version: "2"

linters:
  default: standard
  enable:
    - gosec
  settings:
    gosec:
      excludes:
        # G115: integer overflow conversions. The store adapter clamps every
        # narrowing conversion explicitly (see repos.i32), and generated sqlc
        # code is excluded from review on these grounds.
        - G115
        # G101: "potential hardcoded credentials" fires on constant *names*
        # such as ActionAPITokenRevoked and on a placeholder DSN inside a
        # configuration test. Neither is a credential.
        - G101

formatters:
  enable:
    - gofmt
